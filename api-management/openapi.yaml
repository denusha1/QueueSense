openapi: 3.0.3
info:
  title: QueueSense Weekly Waiting Time
  version: 1.0.0
  description: Read-only partner analytics. Requests require an approved Choreo OAuth
    application and a department grant bound to the signed proxy context.
tags:
- name: Waiting time
  description: Aggregated weekly clinic waiting-time statistics.
servers:
- url: /api/integrations/v1
  description: Relative integration origin base path
paths:
  /wait-time-summary:
    get:
      summary: Get the weekly waiting-time summary
      operationId: getWeeklyWaitingTimeSummary
      parameters:
      - name: department_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
          title: Department Id
        description: Department UUID assigned to the approved proxy.
        example: 5853b5a7-cfa4-4c3d-9c06-e97ce42487a1
      - name: week_start
        in: query
        required: true
        schema:
          type: string
          format: date
          title: Week Start
        description: Monday of a completed clinic week, formatted YYYY-MM-DD.
        example: '2026-11-02'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Data_WeeklyWaitingTime_'
              examples:
                measured:
                  value:
                    data:
                      department_id: 5853b5a7-cfa4-4c3d-9c06-e97ce42487a1
                      week_start: '2026-11-02'
                      suppressed: false
                      metrics:
                        measured_waits: 42
                        average_wait: 14.2
                        median_wait: 12.0
                        p90_wait: 25.0
                suppressed:
                  value:
                    data:
                      department_id: 5853b5a7-cfa4-4c3d-9c06-e97ce42487a1
                      week_start: '2026-11-02'
                      suppressed: true
                      metrics: null
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
        '400':
          description: Malformed request
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Valid gateway assertion required at the origin
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: Proxy context or department is outside the approved grant
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: Invalid request
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: QueueSense origin limit reached. Gateway-generated 429 responses
            may differ.
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
            Retry-After:
              schema:
                type: integer
                minimum: 1
              description: Seconds before retrying an origin-rejected request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                success: false
                error:
                  code: rate_limited
                  message: Too many requests. Wait before retrying.
                  details: []
                request_id: 72697aba-156f-4bf1-994d-858372a876df
        '500':
          description: Unexpected server failure
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: Database or gateway signing keys temporarily unavailable
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '504':
          description: Operation timed out
          headers:
            X-Request-ID:
              schema:
                type: string
                format: uuid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      tags:
      - Waiting time
      security:
      - ChoreoOAuthBearer: []
      description: Supply the approved department and the Monday of a completed clinic
        week. Dates follow Asia/Colombo clinic time. Results are in minutes. Metrics
        are null when fewer than ten waits were measured. Responses generated by the
        gateway may differ from QueueSense origin responses.
components:
  securitySchemes:
    ChoreoOAuthBearer:
      type: http
      scheme: bearer
      description: OAuth 2.0 access token from the configured Choreo key manager.
  schemas:
    ApiError:
      properties:
        success:
          type: boolean
          enum:
          - false
          title: Success
        error:
          $ref: '#/components/schemas/ErrorDetail'
        request_id:
          type: string
          format: uuid
          title: Request Id
      type: object
      required:
      - success
      - error
      - request_id
      title: ApiError
    Data_WeeklyWaitingTime_:
      properties:
        data:
          $ref: '#/components/schemas/WeeklyWaitingTime'
      type: object
      required:
      - data
      title: Data[WeeklyWaitingTime]
    ErrorDetail:
      properties:
        code:
          type: string
          title: Code
        message:
          type: string
          title: Message
        details:
          items:
            $ref: '#/components/schemas/ValidationIssue'
          type: array
          title: Details
      type: object
      required:
      - code
      - message
      title: ErrorDetail
    ValidationIssue:
      properties:
        field:
          type: string
          title: Field
        code:
          type: string
          title: Code
      type: object
      required:
      - field
      - code
      title: ValidationIssue
    WaitingTime:
      properties:
        measured_waits:
          type: integer
          title: Measured Waits
        average_wait:
          type: number
          nullable: true
          title: Average Wait
        median_wait:
          type: number
          nullable: true
          title: Median Wait
        p90_wait:
          type: number
          nullable: true
          title: P90 Wait
      type: object
      required:
      - measured_waits
      - average_wait
      - median_wait
      - p90_wait
      title: WaitingTime
    WeeklyWaitingTime:
      properties:
        department_id:
          type: string
          format: uuid
          title: Department Id
        week_start:
          type: string
          format: date
          title: Week Start
        suppressed:
          type: boolean
          title: Suppressed
        metrics:
          anyOf:
          - $ref: '#/components/schemas/WaitingTime'
          - type: object
            nullable: true
            enum:
            - null
      type: object
      required:
      - department_id
      - week_start
      - suppressed
      - metrics
      title: WeeklyWaitingTime
