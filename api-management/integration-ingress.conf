# Install as the only server config in a dedicated Nginx ingress.
# The private Compose or platform DNS name "api" resolves to FastAPI.
server {
    listen 443 ssl default_server;
    server_name _;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_certificate /etc/queuesense/tls/origin-fullchain.pem;
    ssl_certificate_key /etc/queuesense/tls/origin-key.pem;
    ssl_client_certificate /etc/queuesense/tls/choreo-client-trust.pem;
    ssl_verify_client on;

    access_log off;
    error_log stderr crit;

    location = /api/integrations/v1/wait-time-summary {
        if ($request_method != GET) { return 405; }

        proxy_pass http://api:8001;
        proxy_connect_timeout 3s;
        proxy_read_timeout 25s;
        proxy_intercept_errors off;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization "";
        proxy_set_header Cookie "";
        proxy_hide_header Set-Cookie;
    }

    location / {
        return 404;
    }
}
