x-app-security: &app-security
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  init: true

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: queuesense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: queuesense
      TZ: Asia/Colombo
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    networks: [data]
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuesense -d queuesense"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    <<: *app-security
    networks: [data]
    build:
      context: .
      dockerfile: database/Dockerfile
    environment:
      COMPOSE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      COMPOSE_RUNTIME_URL: ${AUTH_DATABASE_URL:-}
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate"]
    restart: "no"
  seed:
    <<: *app-security
    networks: [data]
    profiles: ["demo"]
    build:
      context: .
      dockerfile: database/Dockerfile
    environment:
      COMPOSE_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data/generated:/workspace/data/generated:ro
    command: ["seed"]
  api:
    <<: *app-security
    networks: [service, data]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    profiles: ["auth", "full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL:-}
      REQUEST_LOGS_ENABLED: ${REQUEST_LOGS_ENABLED:-true}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      DB_POOL_MAX_SIZE: ${DB_POOL_MAX_SIZE:-0}
      DB_CONNECT_TIMEOUT_SECONDS: ${DB_CONNECT_TIMEOUT_SECONDS:-5}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-20000}
      DB_LOCK_TIMEOUT_MS: ${DB_LOCK_TIMEOUT_MS:-5000}
      APP_ENV: ${APP_ENV:-development}
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET:-}
      JWT_ISSUER: ${JWT_ISSUER:-queuesense-staff}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-queuesense-private-api}
      JWT_ACCESS_TTL_SECONDS: ${JWT_ACCESS_TTL_SECONDS:-600}
      JWT_REFRESH_TTL_SECONDS: ${JWT_REFRESH_TTL_SECONDS:-28800}
      CHOREO_JWKS_URL: ${CHOREO_JWKS_URL:-}
      CHOREO_ASSERTION_ISSUER: ${CHOREO_ASSERTION_ISSUER:-}
      CHOREO_ASSERTION_AUDIENCE: ${CHOREO_ASSERTION_AUDIENCE:-}
      CHOREO_ASSERTION_CONTEXT: ${CHOREO_ASSERTION_CONTEXT:-}
      CHOREO_DEPARTMENT_ID: ${CHOREO_DEPARTMENT_ID:-}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://127.0.0.1:3001,http://localhost:3001}
      ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-false}
      ENABLE_AUTOMATION: ${ENABLE_AUTOMATION:-true}
      ACCOUNT_ENCRYPTION_KEY: ${ACCOUNT_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}
    ports:
      - "${LOCAL_BIND_ADDRESS:-127.0.0.1}:${API_PORT:-8001}:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    <<: *app-security
    networks: [service]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/', {signal: AbortSignal.timeout(3000)}).then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s
    profiles: ["full"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      AUTH_API_URL: http://api:8001
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://127.0.0.1:3001,http://localhost:3001}
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${FRONTEND_PORT:-3001}:3000"
    depends_on:
      api:
        condition: service_healthy
networks:
  data:
  service:
volumes:
  postgres_data:
