services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: queuesense
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: queuesense
      TZ: Asia/Colombo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U queuesense -d queuesense"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build:
      context: .
      dockerfile: database/Dockerfile
    environment:
      DATABASE_URL: postgresql://queuesense:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/queuesense
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate"]
  seed:
    profiles: ["demo"]
    build:
      context: .
      dockerfile: database/Dockerfile
    environment:
      DATABASE_URL: postgresql://queuesense:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/queuesense
    depends_on:
      migrate:
        condition: service_completed_successfully
    volumes:
      - ./data/generated:/workspace/data/generated:ro
    command: ["seed"]
  api:
    profiles: ["auth", "full"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: ${AUTH_DATABASE_URL:-}
      APP_ENV: ${APP_ENV:-development}
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://127.0.0.1:3001,http://localhost:3001}
      ENABLE_DEMO_LOGIN: ${ENABLE_DEMO_LOGIN:-false}
      ENABLE_AUTOMATION: ${ENABLE_AUTOMATION:-true}
      ACCOUNT_ENCRYPTION_KEY: ${ACCOUNT_ENCRYPTION_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SSL: ${SMTP_SSL:-false}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}
    ports:
      - "127.0.0.1:8001:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
  frontend:
    profiles: ["full"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      AUTH_API_URL: http://api:8001
      FRONTEND_ORIGINS: ${FRONTEND_ORIGINS:-http://127.0.0.1:3001,http://localhost:3001}
    ports:
      - "127.0.0.1:3001:3000"
    depends_on:
      - api
volumes:
  postgres_data:
