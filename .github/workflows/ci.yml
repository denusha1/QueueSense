name: QueueSense CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: queuesense-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    uses: ./.github/workflows/backend.yml

  frontend:
    uses: ./.github/workflows/frontend.yml

  deployment-preparation:
    needs: [backend, frontend]
    uses: ./.github/workflows/deployment-preparation.yml
