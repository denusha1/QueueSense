name: QueueSense checks
on: [push, pull_request]
jobs:
  product:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: queuesense_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d queuesense_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r backend/requirements.lock
      - run: python -m unittest discover -s data/generator -p 'test_*.py' -v
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql://test:test@localhost:5432/queuesense_test
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
